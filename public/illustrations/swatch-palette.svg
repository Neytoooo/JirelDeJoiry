      <rect x="-12" y="-200" width="24" height="34" rx="2" fill="#F4EFE7"/>
      <rect x="-12" y="-160" width="24" height="34" rx="2" fill="#D3C9BD"/>
      <rect x="-12" y="-120" width="24" height="34" rx="2" fill="#887C6F"/>
      <rect x="-12" y="-80" width="24" height="34" rx="2" fill="#3A332C"/>
    </g>

    <circle cx="0" cy="-20" r="14" fill="#C09A4D" stroke="#8A5A20" stroke-width="2"/>
    <circle cx="0" cy="-20" r="6" fill="#F4D99D"/>
    <circle cx="0" cy="-20" r="2.5" fill="#5F4214"/>
